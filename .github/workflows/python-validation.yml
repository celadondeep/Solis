name: Python validation

on:
  push:
    branches: [main, codex/eimo-unified-20260912]
    paths:
      - "energy_system/**"
      - "plant_apps.py"
      - "energy_manager.py"
      - "energy_manager_eimo.py"
      - "consumption_model.py"
      - "consumption_model_eimo.py"
      - "solar_timing.py"
      - "battery_health.py"
      - "weekly_report.py"
      - "power_quality_manager.py"
      - "tests/test_*.py"
      - ".github/workflows/python-validation.yml"
  pull_request:
    paths:
      - "energy_system/**"
      - "plant_apps.py"
      - "energy_manager.py"
      - "energy_manager_eimo.py"
      - "consumption_model.py"
      - "consumption_model_eimo.py"
      - "solar_timing.py"
      - "battery_health.py"
      - "weekly_report.py"
      - "power_quality_manager.py"
      - "tests/test_*.py"
      - ".github/workflows/python-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile application and shared modules
        run: |
          python3 -m compileall -q energy_system plant_apps.py
          python3 -m py_compile \
            energy_manager.py \
            energy_manager_eimo.py \
            consumption_model.py \
            consumption_model_eimo.py \
            solar_timing.py \
            battery_health.py \
            weekly_report.py \
            power_quality_manager.py
      - name: Run planner, forecast and configuration tests
        run: python3 -m unittest discover -s tests -v
      - name: Test minute-resolution 100 W crossing
        run: |
          python3 - <<'PY'
          from solar_timing import forecast_threshold_time

          def p(t, kw):
              return {"period_start": t, "pv_estimate": kw}

          # 30-minute forecast samples straddle the 100 W threshold.
          samples = [
              p("2026-09-10T05:30:00+03:00", 0.05),
              p("2026-09-10T06:00:00+03:00", 0.15),
          ]
          assert forecast_threshold_time(samples, 0.10).isoformat() == "2026-09-10T06:00:00+03:00"

          # The estimated crossing is rounded up, never earlier than 100 W.
          samples = [
              p("2026-09-10T05:30:00+03:00", 0.02),
              p("2026-09-10T06:00:00+03:00", 0.14),
          ]
          assert forecast_threshold_time(samples, 0.10).isoformat() == "2026-09-10T06:05:00+03:00"

          # No rising crossing means no wake timestamp.
          samples = [
              p("2026-09-10T05:30:00+03:00", 0.02),
              p("2026-09-10T06:00:00+03:00", 0.08),
          ]
          assert forecast_threshold_time(samples, 0.10) is None
          print("Minute-resolution Solcast 100 W interpolation OK")
          PY
