name: Python validation

on:
  push:
    branches: [main]
    paths:
      - "energy_manager.py"
      - "energy_manager_eimo.py"
      - "consumption_model.py"
      - "consumption_model_eimo.py"
      - "solar_timing.py"
      - ".github/workflows/python-validation.yml"
  pull_request:
    paths:
      - "energy_manager.py"
      - "energy_manager_eimo.py"
      - "consumption_model.py"
      - "consumption_model_eimo.py"
      - "solar_timing.py"
      - ".github/workflows/python-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AppDaemon modules
        run: |
          python3 -m py_compile \
            energy_manager.py \
            energy_manager_eimo.py \
            consumption_model.py \
            consumption_model_eimo.py \
            solar_timing.py
      - name: Verify dynamic night planner markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path("energy_manager.py").read_text()
          eimo = Path("energy_manager_eimo.py").read_text()
          for text in (home, eimo):
              assert "def night_plan_cycle" in text
              assert "NIGHT_PLAN_INTERVAL_S" in text
              assert "plan_generated_at" in text
              assert "plan_valid_until" in text
          assert 'NIGHT_PLAN_SLEEP_ENABLED   = True' in home
          assert 'NIGHT_CONTROL_MIN_SOC      = 12' in home
          assert 'NIGHT_PLAN_SLEEP_ENABLED   = False' in eimo
          assert 'NIGHT_CONTROL_MIN_SOC      = 6' in eimo
          print("Dynamic night planner invariants OK")
          PY

      - name: Test minute-resolution 100 W crossing
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from solar_timing import forecast_threshold_time

          def p(t, kw):
              return {"period_start": t, "pv_estimate": kw}

          # Samples represent 30-min interval averages at their midpoints:
          # 05:45 -> 0.05 kW, 06:15 -> 0.15 kW. Linear 0.10 crossing = 06:00.
          d = [
              p("2026-09-10T05:30:00+03:00", 0.05),
              p("2026-09-10T06:00:00+03:00", 0.15),
          ]
          t = forecast_threshold_time(d, 0.10)
          assert t.isoformat() == "2026-09-10T06:00:00+03:00", t

          # Non-round crossing must round UP, never before >=100 W.
          d = [
              p("2026-09-10T05:30:00+03:00", 0.02),
              p("2026-09-10T06:00:00+03:00", 0.14),
          ]
          t = forecast_threshold_time(d, 0.10)
          assert t.isoformat() == "2026-09-10T06:05:00+03:00", t

          # No rising crossing -> no wake timestamp.
          d = [
              p("2026-09-10T05:30:00+03:00", 0.02),
              p("2026-09-10T06:00:00+03:00", 0.08),
          ]
          assert forecast_threshold_time(d, 0.10) is None
          print("Minute-resolution Solcast 100 W interpolation OK")
          PY
